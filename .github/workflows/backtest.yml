name: NBA EDGE historical walk-forward backtest
on:
  push:
    paths:
      - 'scripts/backtest-model.py'
      - 'scripts/restore-private-datasets.py'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private dataset restore script
        run: python -m py_compile scripts/restore-private-datasets.py
      - name: Restore private datasets from Supabase before backtest
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            python scripts/restore-private-datasets.py
          else
            echo "Public mode; using checked-in datasets."
          fi
      - name: Build leak-free historical backtest
        run: python scripts/backtest-model.py
      - name: Publish private backtest datasets
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; private dataset publishing is skipped."
          else
            python scripts/publish-private-datasets.py
          fi
      - name: Commit backtest metrics
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            echo "Membership mode is enabled; backtest was published to Supabase and will not be committed to the public repository."
            exit 0
          fi
          if [ -z "$(git status --porcelain)" ]; then echo "No backtest changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/backtest.json
          git commit -m "chore: refresh NBA walk-forward backtest"
          git pull --rebase origin main
          git push
