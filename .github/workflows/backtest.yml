name: NBA EDGE historical walk-forward backtest
on:
  push:
    paths:
      - 'scripts/backtest-model.py'
      - 'scripts/restore-private-datasets.py'
      - 'scripts/diagnose-ledger-audit.py'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit and restore scripts
        run: |
          python -m py_compile scripts/restore-private-datasets.py
          python -m py_compile scripts/diagnose-ledger-audit.py
      - name: Restore private datasets from Supabase before backtest
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            python scripts/restore-private-datasets.py
          else
            echo "Public mode; using checked-in datasets."
          fi
      - name: Audit all official private predictions (read-only)
        run: |
          if [ -f public/data/prediction-ledger.json ]; then
            python scripts/diagnose-ledger-audit.py
          else
            echo "Private ledger was not restored; refusing to fabricate audit metrics."
            exit 1
          fi
      - name: Upload aggregate audit report (no game-level picks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-edge-private-ledger-audit
          path: audit/ledger-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Build leak-free historical backtest
        run: python scripts/backtest-model.py
      - name: Publish private backtest datasets
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; private dataset publishing is skipped."
          else
            python scripts/publish-private-datasets.py
          fi
      - name: Commit backtest metrics
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            echo "Membership mode is enabled; backtest was published to Supabase and will not be committed to the public repository."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- public/data/backtest.json)" ]; then echo "No backtest changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/backtest.json
          git commit -m "chore: refresh NBA walk-forward backtest"
          git pull --rebase origin main
          git push
