name: Build and deploy NBA EDGE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Taiwan Sports Lottery NBA odds"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Remove static paid datasets from published site when membership is enabled
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            rm -rf dist/data
            echo "Removed static datasets from the public Pages artifact."
          else
            echo "Membership is disabled; public datasets remain available for current site behavior."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
