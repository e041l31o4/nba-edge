name: Build and deploy NBA EDGE
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.env.production'
      - 'public/data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const report = require('./npm-audit.json')
          console.log('AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('AUDIT_PACKAGE', JSON.stringify({
              name, severity: item.severity, range: item.range,
              via: item.via, fixAvailable: item.fixAvailable
            }))
          }
          NODE
      - run: npm run build
      - name: Remove static paid datasets from published site when membership is enabled
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            rm -rf dist/data
            echo "Removed static datasets from the public Pages artifact."
          else
            echo "Membership is disabled; public datasets remain available for current site behavior."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
