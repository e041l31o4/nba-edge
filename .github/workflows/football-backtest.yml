name: SPORT EDGE football walk-forward audit
on:
  push:
    paths:
      - 'scripts/backtest-football-model.mts'
      - 'src/football.ts'
      - '.github/workflows/football-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run chronological competition-by-competition model audit
        run: npx --yes tsx scripts/backtest-football-model.mts
