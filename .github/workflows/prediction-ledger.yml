name: NBA EDGE prediction ledger
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/prediction-ledger.yml'
      - 'scripts/record-predictions.mts'
      - 'src/model.ts'
      - 'public/data/team-form.json'
      - 'public/data/injuries.json'
      - 'public/data/backtest.json'
      - 'public/data/odds.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-prediction-ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture pregame predictions and settle final scores
        run: npx --yes tsx scripts/record-predictions.mts
      - name: Publish private prediction ledger
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; private dataset publishing is skipped."
          else
            python scripts/publish-private-datasets.py
          fi
      - name: Commit immutable prediction ledger
        run: |
          if [ -z "$(git status --porcelain -- public/data/prediction-ledger.json)" ]; then
            echo "No ledger changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/prediction-ledger.json
          git commit -m "chore: update verified NBA prediction ledger"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another data workflow; retrying ($attempt/3)"
            sleep 2
          done
          echo "Could not push ledger after 3 attempts"
          exit 1
