name: Refresh Taiwan Sports Lottery NBA odds
on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser for official NBA injury report
        run: pip install pypdf
      - name: Refresh team form and NBA official injury report
        run: python scripts/update-analysis-data.py
      - name: Fetch authorized official feed and preserve timestamped snapshots
        env:
          SPORTSLOTTERY_FEED_URL: ${{ secrets.SPORTSLOTTERY_FEED_URL }}
          SPORTSLOTTERY_API_TOKEN: ${{ secrets.SPORTSLOTTERY_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime, pathlib, sys
          feed = os.getenv('SPORTSLOTTERY_FEED_URL', '').strip()
          if not feed:
              print('No documented/authorized official feed configured; safely skipping.')
              sys.exit(0)
          headers = {'Accept': 'application/json', 'User-Agent': 'NBA-EDGE-data-client/1.0'}
          token = os.getenv('SPORTSLOTTERY_API_TOKEN', '').strip()
          if token: headers['Authorization'] = 'Bearer ' + token
          req = urllib.request.Request(feed, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response: payload = json.load(response)
          if not isinstance(payload, dict) or not isinstance(payload.get('games'), list):
              raise SystemExit('Invalid feed: expected JSON object with games[]')
          now = datetime.datetime.now(datetime.timezone.utc)
          out_games, snapshots = [], []
          hist = pathlib.Path('public/data/odds-history.jsonl')
          seen = set()
          if hist.exists():
              for line in hist.read_text(encoding='utf-8').splitlines():
                  try: seen.add(json.loads(line).get('gameId'))
                  except Exception: pass
          for game in payload['games']:
              if not all(game.get(k) for k in ('home_team','away_team','commence_time')): continue
              game['bookmakers'] = game.get('bookmakers') or []
              game['id'] = str(game.get('id') or (game['away_team']+'-'+game['home_team']+'-'+game['commence_time']))
              out_games.append(game)
              start = datetime.datetime.fromisoformat(game['commence_time'].replace('Z','+00:00'))
              mins = (start-now).total_seconds()/60
              phase = 'first_observed' if game['id'] not in seen else ('live' if mins <= 0 else ('pregame' if mins <= 90 else 'pregame_tracking'))
              snapshots.append({'capturedAt':now.isoformat(),'phase':phase,'source':'Taiwan Sports Lottery - authorized feed','gameId':game['id'],'home_team':game['home_team'],'away_team':game['away_team'],'commence_time':game['commence_time'],'bookmakers':game['bookmakers']})
          if not out_games: raise SystemExit('No valid NBA games in official feed; retaining previous data.')
          pathlib.Path('public/data').mkdir(parents=True,exist_ok=True)
          with open('public/data/odds.json','w',encoding='utf-8') as f:
              json.dump({'updatedAt':now.isoformat(),'source':'Taiwan Sports Lottery - authorized feed','games':out_games},f,ensure_ascii=False,separators=(',',':'))
          with hist.open('a',encoding='utf-8') as f:
              for row in snapshots: f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Saved',len(out_games),'official games and',len(snapshots),'timestamped snapshots.')
          PY
      - name: Fetch Taiwan Sports Lottery NBA odds through JBot (optional fallback)
        env:
          JBOT_API_TOKEN: ${{ secrets.JBOT_API_TOKEN }}
          JBOT_POLL_INTERVAL_MINUTES: ${{ vars.JBOT_POLL_INTERVAL_MINUTES }}
          SPORTSLOTTERY_FEED_URL: ${{ secrets.SPORTSLOTTERY_FEED_URL }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime, pathlib
          from zoneinfo import ZoneInfo
          token = os.getenv('JBOT_API_TOKEN', '').strip()
          if os.getenv('SPORTSLOTTERY_FEED_URL', '').strip():
              print('Authorized direct feed is configured; skipping JBot fallback.')
              raise SystemExit(0)
          if not token:
              print('No JBOT_API_TOKEN configured; leaving market odds empty rather than inventing lines.')
              raise SystemExit(0)
          try:
              interval = max(15, int(os.getenv('JBOT_POLL_INTERVAL_MINUTES', '120')))
          except ValueError:
              interval = 120
          now = datetime.datetime.now(ZoneInfo('Asia/Taipei'))
          if (now.hour * 60 + now.minute) % interval >= 15:
              print('Outside configured JBot polling window; skipping to respect API quota.')
              raise SystemExit(0)
          date = now.strftime('%Y-%m-%d')
          query = urllib.parse.urlencode({'sport': 'NBA', 'date': date, 'mode': 'close'})
          request = urllib.request.Request(
              'https://api.sportsbot.tech/v2/odds?' + query,
              headers={'X-JBot-Token': token, 'Accept': 'application/json', 'User-Agent': 'NBA-EDGE/1.0'}
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              payload = json.load(response)
          if payload.get('status') != 'OK' or not isinstance(payload.get('data'), list):
              raise SystemExit('JBot response was not OK; preserving previous odds data.')
          team_names = {
              '亞特蘭大老鷹':'Atlanta Hawks','波士頓塞爾提克':'Boston Celtics','波士頓塞爾蒂克':'Boston Celtics',
              '布魯克林籃網':'Brooklyn Nets','夏洛特黃蜂':'Charlotte Hornets','芝加哥公牛':'Chicago Bulls',
              '克里夫蘭騎士':'Cleveland Cavaliers','達拉斯獨行俠':'Dallas Mavericks','丹佛金塊':'Denver Nuggets',
              '底特律活塞':'Detroit Pistons','金州勇士':'Golden State Warriors','休士頓火箭':'Houston Rockets',
              '印第安納溜馬':'Indiana Pacers','洛杉磯快艇':'Los Angeles Clippers','洛杉磯湖人':'Los Angeles Lakers',
              '曼菲斯灰熊':'Memphis Grizzlies','孟菲斯灰熊':'Memphis Grizzlies','邁阿密熱火':'Miami Heat',
              '密爾瓦基公鹿':'Milwaukee Bucks','明尼蘇達灰狼':'Minnesota Timberwolves','紐奧良鵜鶘':'New Orleans Pelicans',
              '紐約尼克':'New York Knicks','奧克拉荷馬雷霆':'Oklahoma City Thunder','奧蘭多魔術':'Orlando Magic',
              '費城76人':'Philadelphia 76ers','鳳凰城太陽':'Phoenix Suns','波特蘭拓荒者':'Portland Trail Blazers',
              '沙加緬度國王':'Sacramento Kings','聖安東尼奧馬刺':'San Antonio Spurs','多倫多暴龍':'Toronto Raptors',
              '猶他爵士':'Utah Jazz','華盛頓巫師':'Washington Wizards'
          }
          def team_name(value):
              text = str(value or '').strip()
              if text in team_names: return team_names[text]
              return text if text in set(team_names.values()) else None
          games, snapshots = [], []
          history = pathlib.Path('public/data/odds-history.jsonl')
          for item in payload['data']:
              home, away = team_name(item.get('home')), team_name(item.get('away'))
              if not home or not away: continue
              odds_rows = item.get('odds') or []
              if not odds_rows: continue
              current = odds_rows[-1]
              markets = []
              spreads = []
              for point, sides in (current.get('handi') or {}).items():
                  try: line = float(point)
                  except (TypeError, ValueError): continue
                  if sides.get('h') is not None:
                      spreads.append({'name': home, 'point': line, 'price': float(sides['h'])})
                  if sides.get('a') is not None:
                      spreads.append({'name': away, 'point': -line, 'price': float(sides['a'])})
              if spreads: markets.append({'key':'spreads','outcomes':spreads})
              totals = []
              for point, sides in (current.get('total') or {}).items():
                  try: line = float(point)
                  except (TypeError, ValueError): continue
                  if sides.get('o') is not None: totals.append({'name':'Over','point':line,'price':float(sides['o'])})
                  if sides.get('u') is not None: totals.append({'name':'Under','point':line,'price':float(sides['u'])})
              if totals: markets.append({'key':'totals','outcomes':totals})
              if not markets: continue
              game_time = str(item.get('time') or '')
              if game_time and not (game_time.endswith('+08:00') or game_time.endswith('Z')):
                  game_time += '+08:00'
              games.append({
                  'id': str(item.get('id') or ''),
                  'commence_time': game_time,
                  'home_team': home, 'away_team': away,
                  'bookmakers': [{'title':'台灣運彩（JBot 資料）','markets':markets}]
              })
              snapshots.append({
                  'capturedAt': now.isoformat(), 'phase':'latest_observed',
                  'source':'JBot Taiwan Sports Lottery odds aggregator',
                  'gameId': str(item.get('id') or ''),
                  'home_team':home,'away_team':away,'commence_time':game_time,
                  'bookmakers':[{'title':'台灣運彩（JBot 資料）','markets':markets}]
              })
          if not games:
              print('No recognized NBA odds markets returned; retaining previous odds.')
              raise SystemExit(0)
          pathlib.Path('public/data').mkdir(parents=True, exist_ok=True)
          pathlib.Path('public/data/odds.json').write_text(json.dumps({
              'updatedAt': now.isoformat(),
              'source':'JBot Taiwan Sports Lottery odds aggregator (third-party; not direct official feed)',
              'games':games
          },ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          with history.open('a',encoding='utf-8') as handle:
              for row in snapshots:
                  handle.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Saved',len(games),'JBot NBA market records.')
          PY
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/
          git commit -m "chore: refresh official Taiwan Sports Lottery odds"
          git pull --rebase -X theirs origin main
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main
          done
          exit 1
