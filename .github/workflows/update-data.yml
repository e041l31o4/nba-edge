name: Refresh Taiwan Sports Lottery NBA odds
# Verify private Supabase dataset publishing after secret normalization.
on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private dataset restore script
        run: python -m py_compile scripts/restore-private-datasets.py
      - name: Restore private datasets from Supabase before refreshing
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production || [ ! -f public/data/prediction-ledger.json ] || [ ! -f public/data/backtest.json ] || [ ! -f public/data/odds-history.jsonl ]; then
            echo "Restoring datasets from Supabase because membership mode is enabled or historical public datasets are missing."
            python scripts/restore-private-datasets.py
          else
            echo "Public mode; existing checked-in datasets are present."
          fi
      - name: Install PDF parser for official NBA injury report
        run: pip install pypdf
      - name: Refresh team form and NBA official injury report
        run: python scripts/update-analysis-data.py
      - name: Fetch authorized official feed and preserve timestamped snapshots
        env:
          SPORTSLOTTERY_FEED_URL: ${{ secrets.SPORTSLOTTERY_FEED_URL }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime, pathlib, sys, math
          feed = os.getenv('SPORTSLOTTERY_FEED_URL', '').strip()
          if not feed:
              print('No documented/authorized official feed configured; safely skipping.')
              sys.exit(0)
          parsed = urllib.parse.urlparse(feed)
          host = (parsed.hostname or '').lower()
          if parsed.scheme != 'https' or not (host == 'sportslottery.com.tw' or host.endswith('.sportslottery.com.tw')):
              raise SystemExit('Blocked non-official source: only HTTPS *.sportslottery.com.tw domains are allowed.')
          headers = {'Accept': 'application/json', 'User-Agent': 'NBA-EDGE-public-official-site-reader/1.0'}
          req = urllib.request.Request(feed, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response: payload = json.load(response)
          if not isinstance(payload, dict) or not isinstance(payload.get('games'), list):
              raise SystemExit('Invalid feed: expected JSON object with games[]')
          now = datetime.datetime.now(datetime.timezone.utc)
          out_games, snapshots = [], []
          hist = pathlib.Path('public/data/odds-history.jsonl')
          seen = set()
          if hist.exists():
              for line in hist.read_text(encoding='utf-8').splitlines():
                  try: seen.add(json.loads(line).get('gameId'))
                  except Exception: pass
          for game in payload['games']:
              if not all(game.get(k) for k in ('home_team','away_team','commence_time')): continue
              raw_bookmakers = game.get('bookmakers')
              if not isinstance(raw_bookmakers, list):
                  continue
              valid_bookmakers = []
              for bookmaker in raw_bookmakers:
                  if not isinstance(bookmaker, dict) or not bookmaker.get('title') or not isinstance(bookmaker.get('markets'), list):
                      continue
                  valid_markets = []
                  for market in bookmaker['markets']:
                      if not isinstance(market, dict) or market.get('key') not in ('h2h', 'spreads', 'totals') or not isinstance(market.get('outcomes'), list):
                          continue
                      valid_outcomes = []
                      for outcome in market['outcomes']:
                          if not isinstance(outcome, dict):
                              continue
                          try:
                              price = float(outcome.get('price'))
                          except (TypeError, ValueError):
                              continue
                          # Taiwan Sports Lottery decimal odds must be finite and greater than 1.
                          if not math.isfinite(price) or price <= 1:
                              continue
                          clean = dict(outcome)
                          clean['price'] = price
                          valid_outcomes.append(clean)
                      if valid_outcomes:
                          clean_market = dict(market)
                          clean_market['outcomes'] = valid_outcomes
                          valid_markets.append(clean_market)
                  if valid_markets:
                      clean_bookmaker = dict(bookmaker)
                      clean_bookmaker['markets'] = valid_markets
                      valid_bookmakers.append(clean_bookmaker)
              if not valid_bookmakers:
                  continue
              game['bookmakers'] = valid_bookmakers
              game['id'] = str(game.get('id') or (game['away_team']+'-'+game['home_team']+'-'+game['commence_time']))
              out_games.append(game)
              start = datetime.datetime.fromisoformat(game['commence_time'].replace('Z','+00:00'))
              mins = (start-now).total_seconds()/60
              phase = 'first_observed' if game['id'] not in seen else ('live' if mins <= 0 else ('pregame' if mins <= 90 else 'pregame_tracking'))
              snapshots.append({'capturedAt':now.isoformat(),'phase':phase,'source':'Taiwan Sports Lottery - authorized feed','gameId':game['id'],'home_team':game['home_team'],'away_team':game['away_team'],'commence_time':game['commence_time'],'bookmakers':game['bookmakers']})
          if not out_games: raise SystemExit('No valid NBA games in official feed; retaining previous data.')
          pathlib.Path('public/data').mkdir(parents=True,exist_ok=True)
          with open('public/data/odds.json','w',encoding='utf-8') as f:
              json.dump({'updatedAt':now.isoformat(),'source':'Taiwan Sports Lottery - authorized feed','games':out_games},f,ensure_ascii=False,separators=(',',':'))
          with hist.open('a',encoding='utf-8') as f:
              for row in snapshots: f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Saved',len(out_games),'official games and',len(snapshots),'timestamped snapshots.')
          PY
      - name: Enforce official-only odds policy
        run: |
          echo "Only the authorized Taiwan Sports Lottery feed may publish odds. No third-party fallback is permitted."
      - name: Publish private datasets to Supabase
        env:
          SUPABASE_URL: https://hlbwnsndusuwbkqrvcig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; private dataset publishing is skipped."
          else
            python scripts/publish-private-datasets.py
          fi
      - name: Commit refreshed data
        run: |
          if grep -q '^VITE_MEMBERSHIP_ENABLED=true' .env.production; then
            echo "Membership mode is enabled; removing current public dataset files after successful Supabase publishing."
            if [ -n "$(git ls-files public/data)" ]; then
              git rm -r -f --ignore-unmatch public/data
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: remove paid datasets from public repository"
              git pull --rebase -X theirs origin main
              git push
            else
              echo "No tracked public dataset files to remove."
            fi
            exit 0
          fi
          git add -f -A public/data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restore and refresh NBA EDGE analysis datasets"
          git pull --rebase -X theirs origin main
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main
          done
          exit 1
